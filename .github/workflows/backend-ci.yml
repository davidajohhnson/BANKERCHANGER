name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
  pull_request:
    paths:
      - 'backend/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: TypeScript Build + Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: bankerchanger
          POSTGRES_PASSWORD: bankerchanger
          POSTGRES_DB: bankerchanger
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-node-modules
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('backend/package-lock.json') }}

      - name: Install dependencies
        working-directory: backend
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Security Audit - npm HIGH/CRITICAL vulnerabilities
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Validate OpenAPI spec
        working-directory: backend
        run: |
          npm run openapi:generate
          npm run openapi:validate
          git diff --exit-code -- openapi.yaml

      - name: Check migrations for destructive operations
        working-directory: backend
        run: npm run migrate:check
        env:
          MIGRATION_CHECK_STRICT: "true"

      - name: Verify Drizzle schema path is valid
        working-directory: backend
        run: node -e "
          const fs = require('fs');
          const path = require('path');
          const config = require('./drizzle.config').default;
          const schemaPath = path.resolve(__dirname, config.schema);
          if (!fs.existsSync(schemaPath)) {
            console.error('❌ Schema path does not exist:', schemaPath);
            process.exit(1);
          } else {
            console.log('✅ Schema path is valid:', schemaPath);
          }
        "

      - name: Check for Drizzle schema drift
        working-directory: backend
        run: npm run drizzle:check
        env:
          DATABASE_URL: postgresql://bankerchanger:bankerchanger@localhost:5432/bankerchanger

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Build
        working-directory: backend
        run: npm run build
        env:
          GIT_SHA: ${{ github.sha }}

      - name: Test
        working-directory: backend
        run: npm test
        env:
          DATABASE_URL: postgresql://bankerchanger:bankerchanger@localhost:5432/bankerchanger
          BET_LOAD_DATABASE_URL: postgresql://bankerchanger:bankerchanger@localhost:5432/bankerchanger
          REDIS_URL: redis://localhost:6379

      - name: Build production Docker image
        run: docker build -t bankerchanger-backend ./backend

      - name: Verify production dependencies and health endpoint
        run: |
          docker run --rm --entrypoint node bankerchanger-backend -e "require.resolve('@stellar/stellar-sdk')"
          docker run -d --name bankerchanger-backend-ci --network host \
            -e DATABASE_URL=postgresql://bankerchanger:bankerchanger@localhost:5432/bankerchanger \
            -e REDIS_URL=redis://localhost:6379 \
            -e STELLAR_RPC_URL=https://horizon-testnet.stellar.org \
            -e ORACLE_PRIVATE_KEY=S$(printf 'A%.0s' {1..55}) \
            -e ADMIN_JWT_SECRET=ci-admin-secret \
            -e FACTORY_CONTRACT_ADDRESS=ci-factory \
            -e JWT_SECRET=ci-jwt-secret-with-at-least-32-bytes \
            -e PORT=3001 bankerchanger-backend
          trap 'docker rm -f bankerchanger-backend-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3001/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs bankerchanger-backend-ci
          exit 1

      - name: Automated E2E Integration Test Suite
        working-directory: backend
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://bankerchanger:bankerchanger@localhost:5432/bankerchanger
          REDIS_URL: redis://localhost:6379

  load-test:
    name: k6 WebSocket Load Test
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: bankerchanger
          POSTGRES_PASSWORD: bankerchanger
          POSTGRES_DB: bankerchanger
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-node-modules
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('backend/package-lock.json') }}

      - name: Install dependencies
        working-directory: backend
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Start backend server
        working-directory: backend
        run: |
          npx ts-node-dev --respawn src/index.ts &
          sleep 5
        env:
          DATABASE_URL: postgresql://bankerchanger:bankerchanger@localhost:5432/bankerchanger
          REDIS_URL: redis://localhost:6379
          PORT: 3001

      - name: Install k6
        run: |
          sudo gpg -k 0x7F343FA7 2>/dev/null || true
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Run k6 load test
        working-directory: backend
        run: k6 run tests/load/activity-feed.loadtest.js -e WS_URL=ws://localhost:3001

  migration-cycle:
    name: Fresh PostgreSQL migration cycle
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: bankerchanger
          POSTGRES_PASSWORD: bankerchanger
          POSTGRES_DB: bankerchanger
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Apply and roll back migrations on an empty database
        working-directory: backend
        env:
          DATABASE_URL: postgresql://bankerchanger:bankerchanger@localhost:5432/bankerchanger
        run: |
          npm run migrate
          npm run migrate:down:all
          npm run migrate

  production-dependencies:
    name: Production dependency completeness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install production dependencies
        working-directory: backend
        run: npm ci --omit=dev
      - name: Verify Stellar SDK is available in production
        working-directory: backend
        run: node -e "require.resolve('@stellar/stellar-sdk')"
