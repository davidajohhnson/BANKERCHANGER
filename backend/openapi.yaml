openapi: 3.0.3
info:
  title: BANKERCHANGER API
  version: 0.2.0
  description: REST API for the BANKERCHANGER decentralized boxing prediction market.

servers:
  - url: http://localhost:3001
    description: Local development

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    oracleKey:
      type: apiKey
      in: header
      name: X-Oracle-Key

  schemas:
    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string }

    ErrorResponse400:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string, description: "Bad request. Invalid query parameters, request body, or format." }
        code: { type: string, example: "INVALID_REQUEST" }
      required: [ success, message ]

    ErrorResponse401:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string, description: "Missing, invalid, or expired authentication credentials." }
        code: { type: string, example: "UNAUTHORIZED" }
      required: [ success, message ]

    ErrorResponse403:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string, description: "Authenticated but insufficient permissions for this resource." }
        code: { type: string, example: "FORBIDDEN" }
      required: [ success, message ]

    ErrorResponse429:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string, description: "Rate limit exceeded. Check Retry-After header for reset time." }
        code: { type: string, example: "RATE_LIMIT_EXCEEDED" }
        retryAfter: { type: integer, description: "Seconds until the rate limit window resets." }
      required: [ success, message ]

    ErrorResponse500:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string, description: "Internal server error. Please try again later." }
        code: { type: string, example: "INTERNAL_SERVER_ERROR" }
        requestId: { type: string, description: "Unique identifier for this error instance for debugging." }
      required: [ success, message ]

    UserDTO:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        emailVerified: { type: boolean }
        twoFactorEnabled: { type: boolean }
        createdAt: { type: string, format: date-time }

    Market:
      type: object
      properties:
        id: { type: integer }
        market_id: { type: string }
        contract_address: { type: string }
        match_id: { type: string }
        fighter_a: { type: string }
        fighter_b: { type: string }
        weight_class: { type: string }
        title_fight: { type: boolean }
        venue: { type: string }
        scheduled_at: { type: string, format: date-time }
        status:
          type: string
          enum: [ open, locked, resolved, cancelled, disputed ]
        outcome:
          type: string
          nullable: true
          enum: [ fighter_a, fighter_b, draw, no_contest ]
        pool_a: { type: string }
        pool_b: { type: string }
        pool_draw: { type: string }
        total_pool: { type: string }
        fee_bps: { type: integer }
        resolved_at: { type: string, format: date-time, nullable: true }
        oracle_used: { type: string, nullable: true, enum: [ primary, fallback, admin ] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        ledger_sequence: { type: integer }

    MarketOdds:
      type: object
      properties:
        market_id: { type: string }
        odds_a: { type: number }
        odds_b: { type: number }
        odds_draw: { type: number }
        pool_a: { type: string }
        pool_b: { type: string }
        pool_draw: { type: string }
        total_pool: { type: string }

    MarketStats:
      type: object
      properties:
        market_id: { type: string }
        total_bets: { type: integer }
        unique_bettors: { type: integer }
        largest_bet_xlm: { type: number }
        average_bet_xlm: { type: number }
        total_pooled_xlm: { type: number }

    SimulatePayout:
      type: object
      properties:
        market_id: { type: string }
        amount: { type: number }
        outcome: { type: integer, enum: [ 0, 1 ] }
        estimated_payout: { type: number }
        fee_xlm: { type: number }
        odds: { type: number }

    PlatformStats:
      type: object
      properties:
        totalMarkets: { type: integer }
        activeMarkets: { type: integer }
        totalVolume: { type: number }
        totalBets: { type: integer }

    Bet:
      type: object
      properties:
        id: { type: integer }
        market_id: { type: string }
        bettor_address: { type: string }
        side:
          type: string
          enum: [ fighter_a, fighter_b, draw ]
        amount: { type: string }
        amount_xlm: { type: number }
        placed_at: { type: string, format: date-time }
        claimed: { type: boolean }
        claimed_at: { type: string, format: date-time, nullable: true }
        payout: { type: string, nullable: true }
        tx_hash: { type: string }
        ledger_sequence: { type: integer }

    BettorStats:
      type: object
      properties:
        address: { type: string }
        total_bets: { type: integer }
        total_staked_xlm: { type: number }
        total_won_xlm: { type: number }
        total_lost_xlm: { type: number }
        win_rate: { type: number }

    Portfolio:
      type: object
      properties:
        address: { type: string }
        active_bets:
          type: array
          items: { $ref: '#/components/schemas/Bet' }
        past_bets:
          type: array
          items: { $ref: '#/components/schemas/Bet' }
        pending_claims:
          type: array
          items: { $ref: '#/components/schemas/Bet' }
        total_staked_xlm: { type: number }
        total_won_xlm: { type: number }
        total_lost_xlm: { type: number }

    OracleReport:
      type: object
      properties:
        id: { type: integer }
        match_id: { type: string }
        oracle_address: { type: string }
        outcome: { type: string }
        reported_at: { type: string, format: date-time }
        signature: { type: string }
        accepted: { type: boolean }
        tx_hash: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    Dispute:
      type: object
      properties:
        id: { type: string, format: uuid }
        market_id: { type: string }
        reason: { type: string }
        status:
          type: string
          enum: [ open, reviewing, resolved, dismissed ]
        admin_notes: { type: string, nullable: true }
        final_outcome: { type: string, nullable: true }
        raised_at: { type: string, format: date-time }
        reviewed_at: { type: string, format: date-time, nullable: true }
        resolved_at: { type: string, format: date-time, nullable: true }

    Pagination:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
        hasNext: { type: boolean }
        hasPrev: { type: boolean }

    GovernanceProposal:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        value: { type: string }
        description: { type: string }
        status:
          type: string
          enum: [ Active, Passed, Failed, Executed ]
        proposer: { type: string }
        votesFor: { type: number }
        votesAgainst: { type: number }
        votesAbstain: { type: number }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }

  x-rateLimit-defaults:
    description: |
      All endpoints are rate-limited. Limits are enforced per route group using
      Redis-backed counters. When a limit is exceeded the API returns HTTP 429
      with a Retry-After header indicating seconds until the window resets.
    groups:
      - prefix: /auth
        windowMs: 60000
        max: 10
        keyBy: ip
      - prefix: /api
        windowMs: 60000
        max: 60
        keyBy: ip
      - prefix: /api/oracle
        windowMs: 60000
        max: 10
        keyBy: ip
      - prefix: /api/admin
        windowMs: 60000
        max: 20
        keyBy: ip
      - prefix: /trading/bet
        windowMs: 60000
        max: 60
        keyBy: userId
      - prefix: /wallet/withdraw
        windowMs: 60000
        max: 5
        keyBy: userId

paths:
  # ---------------------------------------------------------------------------
  # Operational
  # ---------------------------------------------------------------------------
  /health:
    get:
      summary: Health check for the API, database, and Redis
      operationId: healthCheck
      tags: [ System ]
      responses:
        '200':
          description: All dependencies reachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  db: { type: string, example: connected }
                  redis: { type: string, example: connected }
                  version: { type: string }
        '503':
          description: One or more dependencies unreachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: error }

  /metrics:
    get:
      summary: Prometheus metrics endpoint
      operationId: prometheusMetrics
      tags: [ System ]
      responses:
        '200':
          description: Metrics in Prometheus text exposition format
          content:
            text/plain:
              schema: { type: string }

  # ---------------------------------------------------------------------------
  # Auth
  # ---------------------------------------------------------------------------
  /auth/register:
    post:
      summary: Register a new user
      operationId: register
      tags: [ Auth ]
      x-rateLimit-windowMs: 60000
      x-rateLimit-max: 10
      x-rateLimit-keyBy: ip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ email, password ]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        '201':
          description: Registration successful; verification email sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId: { type: string }
                  message: { type: string }
        '400':
          description: Invalid email format or password too short
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse400' }
        '409':
          description: Email already registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse429' }
        '500':
          description: Internal server error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse500' }

  /auth/login:
    post:
      summary: Login with email and password
      operationId: login
      tags: [ Auth ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ email, password ]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Tokens issued, or tempToken when 2FA is enabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  refreshToken: { type: string }
                  tempToken: { type: string, description: Present only when 2FA is required }
                  requires2FA: { type: boolean }
        '400':
          description: Missing or invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse400' }
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse401' }
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse429' }
        '500':
          description: Internal server error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse500' }

  /auth/refresh:
    post:
      summary: Exchange a refresh token for a new access token
      operationId: refresh
      tags: [ Auth ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ refreshToken ]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: New access and refresh tokens issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  refreshToken: { type: string }
        '400':
          description: Missing or invalid request body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse400' }
        '401':
          description: Invalid, expired, or revoked refresh token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse401' }
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse429' }
        '500':
          description: Internal server error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse500' }

  /auth/logout:
    post:
      summary: Revoke a refresh token server-side
      operationId: logout
      tags: [ Auth ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ refreshToken ]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: Refresh token revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
        '400':
          description: Missing or invalid request body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse400' }
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse429' }
        '500':
          description: Internal server error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse500' }

  /auth/forgot-password:
    post:
      summary: Request a password-reset email
      operationId: forgotPassword
      tags: [ Auth ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ email ]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: Reset link sent (always returned to prevent email enumeration)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '400':
          description: Invalid email format
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse400' }
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse429' }
        '500':
          description: Internal server error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse500' }

  /auth/reset-password:
    post:
      summary: Reset password using a reset token
      operationId: resetPassword
      tags: [ Auth ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ token, newPassword ]
              properties:
                token: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '400':
          description: Invalid or expired token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse400' }
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse429' }
        '500':
          description: Internal server error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse500' }

  /auth/2fa/setup:
    post:
      summary: Generate TOTP secret and QR code
      operationId: setup2FA
      tags: [ Auth ]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: TOTP secret and QR code
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string }
                  qrCode: { type: string, description: Base64 PNG data URI }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse401' }
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse429' }
        '500':
          description: Internal server error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse500' }

  /auth/2fa/enable:
    post:
      summary: Enable 2FA after verifying TOTP code
      operationId: enable2FA
      tags: [ Auth ]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ otp ]
              properties:
                otp: { type: string, minLength: 6, maxLength: 6 }
      responses:
        '200':
          description: 2FA enabled
        '400':
          description: Invalid OTP format
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse400' }
        '401':
          description: Unauthorized or invalid OTP
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse401' }
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse429' }
        '500':
          description: Internal server error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse500' }

  /auth/2fa/disable:
    post:
      summary: Disable 2FA
      operationId: disable2FA
      tags: [ Auth ]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ otp ]
              properties:
                otp: { type: string, minLength: 6, maxLength: 6 }
      responses:
        '200':
          description: 2FA disabled
        '400':
          description: Invalid OTP format
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse400' }
        '401':
          description: Unauthorized or invalid OTP
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse401' }
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse429' }
        '500':
          description: Internal server error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse500' }

  /auth/2fa/verify:
    post:
      summary: Complete login by verifying 2FA OTP
      operationId: verify2FA
      tags: [ Auth ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ tempToken, otp ]
              properties:
                tempToken: { type: string }
                otp: { type: string, minLength: 6, maxLength: 6 }
      responses:
        '200':
          description: Access and refresh tokens issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  refreshToken: { type: string }
        '400':
          description: Invalid request format
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse400' }
        '401':
          description: Invalid temp token or OTP
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse401' }
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse429' }
        '500':
          description: Internal server error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse500' }

  # ---------------------------------------------------------------------------
  # Users
  # ---------------------------------------------------------------------------
  /api/users/me:
    get:
      summary: Get authenticated user's profile
      operationId: getMyProfile
      tags: [ Users ]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/UserDTO' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse401' }
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse429' }
        '500':
          description: Internal server error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse500' }
    patch:
      summary: Update authenticated user's profile
      operationId: updateMyProfile
      tags: [ Users ]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 30
                  pattern: '^[a-zA-Z0-9_]+$'
                avatarUrl: { type: string, format: uri }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/UserDTO' }
        '400':
          description: Invalid profile data
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse400' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse401' }
        '409':
          description: Username already taken
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse429' }
        '500':
          description: Internal server error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse500' }

  /api/users/{address}/history/export:
    get:
      summary: Export user transaction and betting history as CSV or JSON audit report
      operationId: exportUserHistory
      tags: [ Users ]
      parameters:
        - name: address
          in: path
          required: true
          description: Stellar G... wallet address
          schema: { type: string }
        - name: format
          in: query
          required: false
          description: Export format (csv or json)
          schema:
            type: string
            enum: [ csv, json ]
            default: csv
        - name: startDate
          in: query
          required: false
          description: Filter records starting from this ISO 8601 timestamp
          schema: { type: string, format: date-time }
        - name: endDate
          in: query
          required: false
          description: Filter records up to this ISO 8601 timestamp
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Successfully generated audit report stream
          headers:
            Content-Disposition:
              schema: { type: string }
              example: 'attachment; filename="audit-history-GBETTOR...-1724890000000.csv"'
          content:
            text/csv:
              schema: { type: string }
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    timestamp: { type: string, format: date-time }
                    transactionHash: { type: string }
                    marketId: { type: string }
                    marketTitle: { type: string }
                    actionType: { type: string, enum: [ BET, CLAIM, REFUND ] }
                    outcomePicked: { type: string }
                    amountXlm: { type: number }
                    payoutXlm: { type: number }
                    netPnlXlm: { type: number }
        '400':
          description: Invalid address or query parameter format
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse400' }
        '429':
          description: Rate limit exceeded (max 5 requests per minute)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse429' }
        '500':
          description: Internal server error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse500' }

  /api/users/{id}:
    get:
      summary: Get public user profile
      operationId: getProfile
      tags: [ Users ]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Public user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/UserDTO' }
        '400':
          description: Invalid user ID format
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse400' }
        '404':
